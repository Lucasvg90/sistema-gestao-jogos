<div class="content-container">
  <img
    class="fundo-fixo"
    src="https://wallpapercat.com/w/full/e/a/a/4925-2560x1600-desktop-hd-grand-theft-auto-san-andreas-background-image.jpg"
    alt="Fundo gamer"
  />
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Data de Nascimento</th>
          <th>Email</th>
          <th>Telefone</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cliente of listaClientes">
          <td>{{ cliente.id }}</td>
          <td>{{ cliente.nome_cliente }}</td>
          <td>{{ formatDateBR(cliente.data_nascimento) }}</td>
          <td>{{ cliente.email }}</td>
          <td>{{ cliente.telefone }}</td>
          <td>
            <button *ngIf="cliente.id" class="btn-editar" [routerLink]="['/alterar', cliente.id]">Editar</button>
            <button class="btn-excluir" (click)="excluir(cliente.id!)">Excluir</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
